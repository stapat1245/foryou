<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="description" content="A rose bouquet that grows, blooms and sparkles in ASCII, rendered in your browser.">
  <title>hehe</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Ctext x='8' y='12' font-size='12' text-anchor='middle' fill='%23ff2240'%3E%40%3C/text%3E%3C/svg%3E">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="stage">
    <canvas id="stars" aria-hidden="true"></canvas>
    <canvas id="screen" width="791" height="1050" aria-label="Animated ASCII rose bouquet"></canvas>
  </main>

  <div id="loader" class="loader" role="status" aria-live="polite">
    <div class="loader-mark">@</div>
    <p id="loader-title">growing the bouquet</p>
    <div class="bar"><span id="bar"></span></div>
    <p id="loader-detail" class="detail">loading frames</p>
  </div>

  <noscript>
    <div class="fallback">This page needs JavaScript to play the animation.</div>
  </noscript>

  <script src="app.js"></script>
</body>
</html>
